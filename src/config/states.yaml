# Supported states and their specific configurations.
# AidRadar covers all 50 US states.
# FPL region: AK and HI have separate HHS poverty guidelines; all others use contiguous_48_dc.
# medicaid_expansion: whether state has adopted ACA Medicaid expansion as of 2024.

