# Streamlit theme configuration for AidRadar.
# Removes default branding and applies a clean, accessible look.

[theme]
primaryColor = "#2D7A4F"
backgroundColor = "#FAFAF8"
secondaryBackgroundColor = "#F3F2EE"
textColor = "#1A1A18"
font = "sans serif"

[server]
headless = true
port = 8501

[browser]
gatherUsageStats = false
